apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clixx-prod

resources:
  - namespace-clixx.yaml
  - storage-class.yaml
  - pvc.yaml
  - clixx-deployment.yaml
  - clixx-lb-np.yaml
  - clixx-ingress.yaml

configMapGenerator:
  - name: wp-config-template
    files:
      - wp-config.php
  
images:
  - name: 111111111111.dkr.ecr.us-east-1.amazonaws.com/clixx-repository
    newTag: clixx-image-latest